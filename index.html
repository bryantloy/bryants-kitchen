const FRAC = [[0.125, "⅛"], [0.25, "¼"], [0.333, "⅓"], [0.375, "⅜"], [0.5, "½"], [0.625, "⅝"], [0.667, "⅔"], [0.75, "¾"], [0.875, "⅞"]];
function fmtAmount(n) {
  if (n == null || isNaN(n)) return "";
  if (n >= 10) return String(Math.round(n * 10) / 10);
  const whole = Math.floor(n + 1e-9);
  const rem = n - whole;
  if (rem < 0.06) return String(whole || 0);
  let best = null,
    bestD = Infinity;
  for (const [v, g] of FRAC) {
    const d = Math.abs(rem - v);
    if (d < bestD) {
      bestD = d;
      best = g;
    }
  }
  if (bestD > 0.06) return String(Math.round(n * 100) / 100);
  return whole > 0 ? `${whole}${best}` : best;
}
function fmtIng(ing, mult) {
  const amt = fmtAmount(ing.amount * mult);
  return ing.unit ? `${amt} ${ing.unit} ${ing.name}` : `${amt} ${ing.name}`;
}
const fmtClock = s => `${Math.floor(Math.abs(s) / 60)}:${String(Math.abs(s) % 60).padStart(2, "0")}`;
function fmtDur(s) {
  if (s >= 3600) {
    const h = Math.floor(s / 3600),
      m = Math.round(s % 3600 / 60);
    return m ? `${h}h ${m}m` : `${h}h`;
  }
  return `${Math.round(s / 60)}m`;
}
function parseStep(content, ingMap, mult) {
  const parts = [];
  const re = /\{([a-z0-9_]+)\}/gi;
  let last = 0,
    m;
  while ((m = re.exec(content)) !== null) {
    if (m.index > last) parts.push({
      t: "text",
      v: content.slice(last, m.index)
    });
    const ing = ingMap[m[1]];
    parts.push(ing ? {
      t: "ing",
      v: fmtIng(ing, mult)
    } : {
      t: "text",
      v: m[0]
    });
    last = m.index + m[0].length;
  }
  if (last < content.length) parts.push({
    t: "text",
    v: content.slice(last)
  });
  return parts;
}
function beep() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    [0, 0.28, 0.56].forEach(t => {
      const o = ctx.createOscillator(),
        g = ctx.createGain();
      o.type = "sine";
      o.frequency.value = 784;
      g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.22);
      o.connect(g);
      g.connect(ctx.destination);
      o.start(ctx.currentTime + t);
      o.stop(ctx.currentTime + t + 0.24);
    });
  } catch (e) {/* no audio */}
}
